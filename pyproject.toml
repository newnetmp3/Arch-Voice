[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-voice"
version = "0.1.0"
description = "Real-time voice changer for PipeWire with a GTK 4 GUI and dozens of presets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/newnetmp3/Arch-Voice"

[project.scripts]
arch-voice = "arch_voice.cli:main"

[tool.setuptools]
packages = ["arch_voice"]
